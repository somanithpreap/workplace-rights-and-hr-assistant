<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mekong Apparel HR Assistant</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧵</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Khmer:wght@400;600&display=swap" rel="stylesheet">
<!--
  React chat screen for the HR Assistant.
  No build step: React and Babel load from a CDN, Babel turns the JSX below into JavaScript in the browser.
  The page talks to our own FastAPI backend (server.py) at the same address:
    GET /employees   POST /login   POST /chat   POST /confirm   GET /health
-->
<style>
  :root {
    --indigo: #1F3A5F;        /* denim: header, user messages */
    --indigo-deep: #152A45;
    --thread: #E0A526;        /* yellow denim stitching: citation tags, focus */
    --cotton: #EEF1F5;        /* page background */
    --surface: #FFFFFF;
    --ink: #18212B;
    --slate: #5B6878;
    --line: #D5DCE4;
    --red: #B23A3A;
    --green: #2F7A55;
    --font: "Atkinson Hyperlegible", "Noto Sans Khmer", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; }
  body { font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--ink); background: var(--cotton); }
  button, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--thread); outline-offset: 2px; }

  /* ---------- top bar ---------- */
  .bar { display: flex; align-items: center; gap: 16px; padding: 12px 24px; background: var(--indigo); color: #fff; }
  .bar h1 { font-size: 18px; margin: 0; font-weight: 700; }
  .bar .who { margin-left: auto; font-size: 14px; opacity: .9; }
  .bar button { background: transparent; border: 1px solid rgba(255,255,255,.45); color: #fff; border-radius: 6px;
                padding: 6px 12px; cursor: pointer; font-size: 14px; }
  .bar button:hover { background: rgba(255,255,255,.12); }

  /* ---------- layout ---------- */
  .app { display: flex; flex-direction: column; height: 100%; }
  .main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 440px); min-height: 0; }
  .main.no-trace { grid-template-columns: minmax(0, 1fr); }
  .chat { display: flex; flex-direction: column; min-height: 0; }
  .scroll { flex: 1; overflow-y: auto; padding: 24px; }
  .thread { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  /* ---------- messages ---------- */
  .msg-user { align-self: flex-end; max-width: 80%; background: var(--indigo); color: #fff; padding: 10px 14px;
              border-radius: 14px 14px 4px 14px; white-space: pre-wrap; }
  .msg-bot { align-self: flex-start; max-width: 92%; background: var(--surface); border: 1px solid var(--line);
             border-radius: 4px 14px 14px 14px; padding: 14px 16px; cursor: pointer; }
  .msg-bot.selected { border-color: var(--indigo); box-shadow: inset 3px 0 0 var(--indigo); }
  .msg-bot.blocked { border-left: 4px solid var(--red); }
  .msg-bot p { margin: 0 0 8px; }
  .msg-bot p:last-child { margin-bottom: 0; }
  .msg-bot em { color: var(--slate); font-size: 14px; }
  .note { font-size: 13px; color: var(--slate); margin-top: 8px; }
  .note.red { color: var(--red); }

  /* the one memorable element: citations as sewn-in care labels */
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .tag { font-size: 13px; color: var(--indigo); background: var(--surface); padding: 3px 10px; border-radius: 2px;
         border: 1px solid var(--line); outline: 1.5px dashed var(--thread); outline-offset: -4px; }

  /* draft leave request card */
  .draft { margin-top: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--cotton); }
  .draft dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0 0 10px; font-size: 14px; }
  .draft dt { color: var(--slate); }
  .draft dd { margin: 0; }
  .btn { border-radius: 6px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); }
  .btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.dark { background: var(--indigo); border-color: var(--indigo); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }

  /* empty state */
  .empty { max-width: 760px; margin: 8vh auto 0; }
  .empty h2 { font-size: 26px; line-height: 1.25; margin: 0 0 6px; }
  .empty p { color: var(--slate); margin: 0 0 18px; max-width: 60ch; }
  .suggest { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .suggest button { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
                    padding: 10px 12px; cursor: pointer; font-size: 15px; }
  .suggest button:hover { border-color: var(--indigo); }

  /* composer */
  .composer { border-top: 1px solid var(--line); background: var(--surface); padding: 14px 24px; }
  .composer form { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  .composer textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
                       min-height: 46px; max-height: 160px; background: var(--surface); }
  .error { max-width: 760px; margin: 0 auto 10px; padding: 10px 12px; border-radius: 8px; background: #FBEAEA;
           color: var(--red); font-size: 14px; }
  .typing { color: var(--slate); font-size: 14px; }

  /* ---------- trace panel ---------- */
  .trace { border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 20px; font-size: 14px; }
  .trace h2 { font-size: 16px; margin: 0 0 4px; }
  .trace h3 { font-size: 14px; margin: 18px 0 6px; color: var(--slate); font-weight: 700; }
  .trace .q { margin: 0 0 4px; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; }
  .kv dt { color: var(--slate); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--slate); font-weight: 700; font-size: 13px; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tr.total td { font-weight: 700; border-bottom: none; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
  .pill.ok { color: var(--green); border-color: var(--green); }
  .pill.bad { color: var(--red); border-color: var(--red); }
  .muted { color: var(--slate); }

  /* ---------- sign-in ---------- */
  .signin { min-height: 100%; display: grid; place-items: center; padding: 24px; }
  .signin .card { width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--line);
                  border-radius: 12px; padding: 28px; }
  .signin h1 { font-size: 24px; line-height: 1.25; margin: 0 0 8px; }
  .signin p { color: var(--slate); margin: 0 0 20px; }
  .signin label { display: block; font-weight: 700; margin-bottom: 6px; }
  .signin select { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 16px;
                   background: var(--surface); }
  .signin .btn { width: 100%; }

  @media (max-width: 900px) {
    .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
    .trace { border-left: none; border-top: 1px solid var(--line); max-height: 45vh; }
    .bar { flex-wrap: wrap; padding: 10px 14px; }
    .scroll, .composer { padding-left: 14px; padding-right: 14px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .msg-bot, .msg-user { animation: in .18s ease-out; }
    @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;
const API = "";   // same address as the page. If you run React separately, put "http://127.0.0.1:8000" here.

const SUGGESTIONS = {
  worker: [
    "What happens if a public holiday falls on a Sunday?",
    "How much annual leave do I have left this year?",
    "Book 3 days of annual leave for me starting 26 October.",
    "How long is maternity leave?",
    "How much seniority indemnity will I get in December?",
    "What is Kong Dara's salary and phone number?",
  ],
  hr_officer: [
    "Which fixed-duration contracts have already passed their end date?",
    "Which public holidays in 2026 fall on a Sunday?",
    "What is the 2026 minimum wage for garment workers, and what was it in 2019?",
    "Does the 1997 Labour Law cap dismissal indemnity at 6 months? Is that still the rule?",
  ],
};

// ---------------------------------------------------------------- talking to the backend
class ApiError extends Error {
  constructor(status, message) { super(message); this.status = status; }
}

async function api(path, { body, token, method } = {}) {
  let res;
  try {
    res = await fetch(API + path, {
      method: method || (body ? "POST" : "GET"),
      headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) {
    throw new ApiError(0, "Cannot reach the backend. Start it with: uvicorn server:app --port 8000");
  }
  const raw = await res.text();
  let data;
  try { data = JSON.parse(raw); } catch { data = { detail: raw.slice(0, 300) || res.statusText }; }
  if (!res.ok) {
    const detail = typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail || data);
    throw new ApiError(res.status, detail);
  }
  return data;
}

const newThreadId = () => Math.random().toString(36).slice(2, 8);

// Answers come from the LLM: escape everything first, then allow only **bold**, _italic_ and line breaks.
function Formatted({ text }) {
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const paras = esc(text || "").split(/\n{2,}/).map((p) =>
    p.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
     .replace(/(^|\s)_(.+?)_(?=\s|$|[.,])/g, "$1<em>$2</em>")
     .replace(/\n/g, "<br>"));
  return paras.map((html, i) => <p key={i} dangerouslySetInnerHTML={{ __html: html }} />);
}

// ---------------------------------------------------------------- sign-in screen
function SignIn({ onSignedIn }) {
  const [people, setPeople] = useState([]);
  const [pick, setPick] = useState("E004");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    api("/employees").then(setPeople).catch((e) => setError(e.message));
  }, []);

  async function signIn(e) {
    e.preventDefault();
    setBusy(true); setError("");
    try { onSignedIn(await api("/login", { body: { employee_id: pick } })); }
    catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  return (
    <div className="signin">
      <form className="card" onSubmit={signIn}>
        <h1>Mekong Apparel HR Assistant</h1>
        <p>Ask about leave, wages, overtime, seniority indemnity and social security. Every answer shows the
           article it comes from.</p>
        <label htmlFor="who">Sign in as (demo login)</label>
        <select id="who" value={pick} onChange={(e) => setPick(e.target.value)}>
          {people.map((p) => (
            <option key={p.employee_id} value={p.employee_id}>
              {p.employee_id} {p.name} ({p.role === "hr_officer" ? "HR officer" : "worker"})
            </option>
          ))}
        </select>
        {error && <div className="error">{error}</div>}
        <button className="btn dark" disabled={busy || !people.length}>{busy ? "Signing in..." : "Sign in"}</button>
      </form>
    </div>
  );
}

// ---------------------------------------------------------------- one assistant message
function BotMessage({ m, selected, onSelect, onConfirm, onCancel }) {
  const r = m.result || {};
  const blocked = r.guard && r.guard.action === "block";
  const draft = r.pending_action && r.pending_action.draft;
  return (
    <div className={"msg-bot" + (selected ? " selected" : "") + (blocked ? " blocked" : "")}
         onClick={onSelect} role="button" tabIndex={0}
         onKeyDown={(e) => e.key === "Enter" && onSelect()}>
      <Formatted text={m.content} />
      {r.citations && r.citations.length > 0 && (
        <div className="tags">{r.citations.map((c) => <span className="tag" key={c}>{c}</span>)}</div>
      )}
      {blocked && <div className="note red">Stopped by the input guard ({r.guard.type.replace(/_/g, " ")}).</div>}
      {draft && !m.done && (
        <div className="draft" onClick={(e) => e.stopPropagation()}>
          <dl>
            <dt>Type</dt><dd>{draft.leave_type} leave</dd>
            <dt>Dates</dt><dd>{draft.start_date} to {draft.end_date}</dd>
            <dt>Working days</dt><dd>{draft.working_days}</dd>
          </dl>
          <div className="row">
            <button className="btn primary" onClick={onConfirm}>Submit leave request</button>
            <button className="btn" onClick={onCancel}>Cancel</button>
          </div>
        </div>
      )}
      {r.route && <div className="note">Path: {r.route}{r.total_ms != null && `, ${(r.total_ms / 1000).toFixed(1)} s`}</div>}
    </div>
  );
}

// ---------------------------------------------------------------- trace panel (presentation Section 2)
function TracePanel({ r }) {
  if (!r) {
    return (
      <aside className="trace">
        <h2>Trace</h2>
        <p className="muted">Ask a question. The state after every step of the pipeline shows here.
           Click any answer to see its trace again.</p>
      </aside>
    );
  }
  const kept = (r.cards || []).filter((c) => c.kept).length;
  return (
    <aside className="trace" aria-label="Trace of the selected answer">
      <h2>Trace of turn {r.turn_id}</h2>
      <dl className="kv">
        <dt>Question</dt><dd>{r.question}</dd>
        {r.is_followup && <><dt>Rewritten</dt><dd>{r.rewritten_question}</dd></>}
        <dt>Guard</dt><dd><span className={"pill " + (r.guard.action === "block" ? "bad" : "ok")}>
          {r.guard.action}</span> {r.guard.type.replace(/_/g, " ")}</dd>
        {r.route && <><dt>Route</dt><dd>{r.route}: {r.route_reason}</dd></>}
        {r.output_check && <><dt>Output check</dt><dd><span className={"pill " + (r.output_check.ok ? "ok" : "bad")}>
          {r.output_check.ok ? "pass" : "fail"}</span> {(r.output_check.problems || []).join(", ")}</dd></>}
        <dt>Thread</dt><dd>{r.thread_id}</dd>
      </dl>

      <h3>Steps</h3>
      <table>
        <thead><tr><th>Step</th><th>Output (state written)</th><th className="num">ms</th><th className="num">Tokens</th></tr></thead>
        <tbody>
          {r.steps.map((s, i) => (
            <tr key={i}><td>{s.step}</td><td>{String(s.output)}</td>
              <td className="num">{s.ms}</td><td className="num">{s.tokens ?? "-"}</td></tr>
          ))}
          <tr className="total"><td>Total</td><td>{r.llm_calls} LLM call(s)</td>
            <td className="num">{r.total_ms}</td><td className="num">{r.total_tokens}</td></tr>
        </tbody>
      </table>

      {r.memory_window && r.memory_window.length > 0 && (<>
        <h3>Memory window sent to the model</h3>
        <ol className="muted" style={{ paddingLeft: 18, margin: 0 }}>
          {r.memory_window.map((w, i) => <li key={i}>{w}</li>)}
        </ol>
      </>)}

      {r.tool_calls && r.tool_calls.length > 0 && (<>
        <h3>Tool calls</h3>
        {r.tool_calls.map((t, i) => (
          <dl className="kv" key={i} style={{ marginBottom: 8 }}>
            <dt>Tool</dt><dd>{t.tool}({JSON.stringify(t.args)})</dd>
            <dt>Result</dt><dd>{t.summary}</dd>
            {t.untrusted_text_removed && <><dt>Filter</dt><dd>instruction-like text removed</dd></>}
          </dl>
        ))}
      </>)}

      {r.cards && r.cards.length > 0 && (<>
        <h3>Retrieved cards ({kept} kept of {r.cards.length})</h3>
        <table>
          <thead><tr><th>Card</th><th className="num">BM25</th><th className="num">Dense</th><th>Used</th></tr></thead>
          <tbody>
            {r.cards.map((c, i) => (
              <tr key={i}><td>{c.citation}</td><td className="num">{c.bm25}</td>
                <td className="num">{c.dense ?? "-"}</td>
                <td>{c.kept ? "yes" : <span className="muted">{c.why_dropped}</span>}</td></tr>
            ))}
          </tbody>
        </table>
      </>)}
    </aside>
  );
}

// ---------------------------------------------------------------- the app
function App() {
  const [user, setUser] = useState(null);           // {token, employee_id, role, name}
  const [messages, setMessages] = useState([]);
  const [thread, setThread] = useState(newThreadId());
  const [selected, setSelected] = useState(null);   // index of the message whose trace is shown
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [showTrace, setShowTrace] = useState(true);
  const [health, setHealth] = useState(null);
  const endRef = useRef(null);

  useEffect(() => { api("/health").then(setHealth).catch(() => {}); }, []);
  useEffect(() => { endRef.current && endRef.current.scrollIntoView({ block: "end" }); }, [messages, busy]);

  function handleError(e) {
    if (e.status === 401) { setUser(null); setError("The backend restarted, so you were signed out. Sign in again."); }
    else setError(e.message + (e.status >= 500 ? "  (Full error: see the uvicorn terminal.)" : ""));
  }

  async function send(text) {
    const q = (text ?? input).trim();
    if (!q || busy) return;
    setInput(""); setError(""); setBusy(true);
    setMessages((ms) => [...ms, { role: "user", content: q }]);
    try {
      const r = await api("/chat", { body: { message: q, thread_id: thread }, token: user.token });
      setMessages((ms) => {
        const next = [...ms, { role: "assistant", content: r.answer, result: r }];
        setSelected(next.length - 1);
        return next;
      });
    } catch (e) { handleError(e); }
    finally { setBusy(false); }
  }

  async function confirm(i) {
    const action = messages[i].result.pending_action;
    try {
      const res = await api("/confirm", { body: { action_id: action.action_id }, token: user.token });
      setMessages((ms) => ms.map((m, j) => (j === i ? { ...m, done: true } : m))
        .concat({ role: "assistant", content: res.message }));
    } catch (e) { handleError(e); }
  }

  function cancel(i) {
    setMessages((ms) => ms.map((m, j) => (j === i ? { ...m, done: true } : m))
      .concat({ role: "assistant", content: "Cancelled. Nothing was submitted." }));
  }

  function newConversation() { setMessages([]); setSelected(null); setThread(newThreadId()); setError(""); }

  if (!user) {
    return (<>
      {error && <div className="error" style={{ marginTop: 16 }}>{error}</div>}
      <SignIn onSignedIn={(u) => { setUser(u); setError(""); newConversation(); }} />
    </>);
  }

  const selectedResult = selected != null && messages[selected] ? messages[selected].result : null;
  return (
    <div className="app">
      <header className="bar">
        <h1>Mekong Apparel HR Assistant</h1>
        <span className="who">
          {user.name}, {user.employee_id}, {user.role === "hr_officer" ? "HR officer" : "worker"}
          {health && ` | ${health.llm_mode}, ${health.search_mode} search`}
        </span>
        <button onClick={newConversation}>New conversation</button>
        <button onClick={() => setShowTrace((v) => !v)}>{showTrace ? "Hide trace" : "Show trace"}</button>
        <button onClick={() => { setUser(null); setMessages([]); }}>Sign out</button>
      </header>

      <div className={"main" + (showTrace ? "" : " no-trace")}>
        <section className="chat">
          <div className="scroll">
            {messages.length === 0 ? (
              <div className="empty">
                <h2>What would you like to know, {user.name.split(" ").slice(-1)[0]}?</h2>
                <p>Answers come from the Labour Law, the Social Security Law, the Minimum Wage Law, Ministry guidance
                   and the factory's work rules. This is information, not legal advice.</p>
                <div className="suggest">
                  {SUGGESTIONS[user.role].map((s) => <button key={s} onClick={() => send(s)}>{s}</button>)}
                </div>
              </div>
            ) : (
              <div className="thread">
                {messages.map((m, i) => m.role === "user"
                  ? <div className="msg-user" key={i}>{m.content}</div>
                  : <BotMessage key={i} m={m} selected={i === selected && showTrace}
                                onSelect={() => m.result && setSelected(i)}
                                onConfirm={() => confirm(i)} onCancel={() => cancel(i)} />)}
                {busy && <div className="typing">Checking the documents...</div>}
                <div ref={endRef} />
              </div>
            )}
          </div>
          <div className="composer">
            {error && <div className="error" role="alert">{error}</div>}
            <form onSubmit={(e) => { e.preventDefault(); send(); }}>
              <textarea rows={1} value={input} placeholder="Ask about leave, wages, overtime..."
                        aria-label="Your question" onChange={(e) => setInput(e.target.value)}
                        onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }} />
              <button className="btn dark" disabled={busy || !input.trim()}>Ask</button>
            </form>
          </div>
        </section>
        {showTrace && <TracePanel r={selectedResult} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
